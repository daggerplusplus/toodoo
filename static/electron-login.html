<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toodoo &mdash; Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f4f0;--card-bg:#ffffff;--border:#e5e4e0;--text:#1a1917;--muted:#8a8880;
  --accent:#4f7ef8;--danger:#ef4444;--sans:'Plus Jakarta Sans',sans-serif;--radius:14px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1917;--card-bg:#222120;--border:#38362f;--text:#f0ede8;--muted:#9a9488;}
}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  min-height:100dvh;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:36px 32px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.08);
}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.4px;margin-bottom:28px;}
.logo svg{opacity:.8;flex-shrink:0;}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
input{
  width:100%;padding:10px 12px;font-family:var(--sans);font-size:14px;
  border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;
  transition:border-color .12s,box-shadow .12s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);}
input::placeholder{color:var(--muted);}
.error{font-size:13px;color:var(--danger);margin-bottom:16px;padding:8px 12px;background:color-mix(in srgb,var(--danger) 10%,transparent);border-radius:7px;display:none;}
.error.visible{display:block;}
button[type=submit]{
  width:100%;margin-top:16px;padding:10px;font-family:var(--sans);font-size:14px;font-weight:500;
  background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;transition:background .12s;
}
button[type=submit]:hover{background:#3b6be0;}
button[type=submit]:disabled{opacity:.6;cursor:wait;}
.server-field{margin-bottom:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
    </svg>
    Toodoo
  </div>
  <div class="error" id="error-msg">Invalid credentials.</div>
  <form method="post" id="login-form">
    <div class="server-field">
      <label for="server">Server URL</label>
      <input type="url" id="server" placeholder="http://192.168.1.100:8001" required>
    </div>
    <label for="un">Username</label>
    <input type="text" id="un" name="username" autocomplete="username" required style="margin-bottom:12px">
    <label for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Sign in</button>
  </form>
  <p style="margin-top:16px;font-size:12px;color:var(--muted);text-align:center">
    Connect to your Toodoo server on the network.
  </p>
</div>
<script>
const form = document.getElementById('login-form');
const serverInput = document.getElementById('server');
const errorMsg = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');

serverInput.value = localStorage.getItem('toodoo_server_url') || '';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const serverUrl = serverInput.value.replace(/\/+$/, '');
  const username = document.getElementById('un').value;
  const pw = document.getElementById('pw').value;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in...';
  errorMsg.classList.remove('visible');

  try {
    const loginPayload = { username: username, pwd: pw };
    const res = await fetch(serverUrl + '/api/electron-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(loginPayload),
    });
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('toodoo_api_token', data.token);
      localStorage.setItem('toodoo_server_url', serverUrl);
      window.location.href = './';
    } else {
      errorMsg.textContent = 'Invalid credentials.';
      errorMsg.classList.add('visible');
    }
  } catch (err) {
    errorMsg.textContent = 'Cannot reach server. Check the URL.';
    errorMsg.classList.add('visible');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
